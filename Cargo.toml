[workspace]
resolver = "3"
members = ["crates/bitgolf-core", "crates/bitgolf-cli", "crates/bitgolf-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Aamod Bhatt"]
repository = "https://github.com/aamodbhatt/bitgolf"

[workspace.dependencies]
bitgolf-core = { path = "crates/bitgolf-core", default-features = false }
crc = "3.2"
miniz_oxide = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "2.0"
proptest = "1.6"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tiny_http = "0.12"
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

# Model inference is unusably slow without optimisation, so tests build optimised code too.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3
