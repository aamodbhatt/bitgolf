[project]
name = "bitgolf-train"
version = "0.1.0"
description = "Training, quantisation-aware fine-tuning and export of bitgolf byte-level models"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Aamod Bhatt" }]
dependencies = [
  "torch==2.14.1",
  "numpy>=2.1",
  "pyarrow>=18",
  "huggingface_hub>=0.30",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.15", "ruff>=0.11"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitgolf_train"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]
# `import torch.nn.functional as F` is the universal PyTorch convention.
ignore = ["N812"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["bitgolf_train"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
